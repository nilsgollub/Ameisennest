<!DOCTYPE html>
<!--
  FORMICA-OS Kiosk — Hauptseite
  Dient von nginx auf dem Raspberry Pi 4.

  Offline-fähig: keine externen Ressourcen, kein CDN.
  Für Touchscreen optimiert (48px Touch-Targets, cursor:none).
-->
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preconnect" href="http://formicarium-cam1.local">
    <title>FORMICA-OS · Kamera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

    <!-- Stream-Bereich -->
    <div id="stream-container">
        <img id="cam-stream" alt="Formicarium Livestream" draggable="false">
        <div id="cam-badge">CAM · formicarium-cam1</div>
        <div id="stream-overlay" role="status" aria-live="polite">
            <span class="status-icon" aria-hidden="true">◎</span>
            <span id="overlay-text">Verbinde …</span>
        </div>
    </div>

    <!-- Control-Bar -->
    <div id="control-bar" role="toolbar" aria-label="Steuerung">

        <!-- Zoom -->
        <div class="ctrl-group">
            <span class="ctrl-label">ZOOM</span>
            <div class="btn-row">
                <button class="ctrl-btn" id="zoom-minus" aria-label="Zoom raus">−</button>
                <span class="ctrl-value" id="zoom-value">2.0×</span>
                <button class="ctrl-btn" id="zoom-plus"  aria-label="Zoom rein">+</button>
            </div>
        </div>

        <div class="ctrl-divider"></div>

        <!-- IR -->
        <div class="ctrl-group">
            <span class="ctrl-label">IR-LED</span>
            <div class="btn-row">
                <button class="ctrl-btn ir-btn active" data-level="0"   aria-label="IR aus">AUS</button>
                <button class="ctrl-btn ir-btn"        data-level="85"  aria-label="IR 33%">33%</button>
                <button class="ctrl-btn ir-btn"        data-level="170" aria-label="IR 66%">66%</button>
                <button class="ctrl-btn ir-btn"        data-level="255" aria-label="IR 100%">MAX</button>
            </div>
        </div>

        <div class="ctrl-divider"></div>

        <!-- Pan -->
        <div class="ctrl-group">
            <span class="ctrl-label">PAN</span>
            <div id="pan-pad" role="group" aria-label="Bildausschnitt">
                <button class="pan-btn" data-dx="0"   data-dy="-15" aria-label="Hoch">↑</button>
                <button class="pan-btn" data-dx="-15" data-dy="0"   aria-label="Links">←</button>
                <button class="pan-btn" id="pan-center-btn"          aria-label="Zentrieren">⊕</button>
                <button class="pan-btn" data-dx="15"  data-dy="0"   aria-label="Rechts">→</button>
                <button class="pan-btn" data-dx="0"   data-dy="15"  aria-label="Runter">↓</button>
            </div>
        </div>

        <div class="ctrl-divider"></div>

        <!-- Reload + Reboot -->
        <div class="ctrl-group">
            <span class="ctrl-label">&nbsp;</span>
            <div class="btn-row">
                <button class="ctrl-btn" id="reload-btn"      aria-label="Stream neu laden">↺</button>
                <button class="ctrl-btn" id="screensaver-btn" aria-label="Bildschirmschoner starten">🐜</button>
                <button class="ctrl-btn" id="reboot-btn"      aria-label="Pi neu starten (halten)">⏻</button>
            </div>
        </div>

    </div>

</div>

<!-- ========================================================
     Bildschirmschoner-Overlay
     Aktiviert nach SCREENSAVER_TIMEOUT_MS Inaktivität.
     Das rote × oben mittig schließt ihn wieder.
     ======================================================== -->
<div id="screensaver" class="hidden" aria-hidden="true">
    <iframe id="screensaver-frame" src="" allow="autoplay; fullscreen"></iframe>
    <button id="screensaver-close" aria-label="Bildschirmschoner schließen">×</button>
</div>

<script src="app.js"></script>
</body>
</html>
