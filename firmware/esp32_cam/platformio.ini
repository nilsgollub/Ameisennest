; ============================================================
; FORMICA-OS — ESP32-S3 AI CAM (DFRobot DFR1154)
; Kameranode: MJPEG-Stream + IR-LED + MQTT-Heartbeat
;
; Hardware:  DFRobot DFR1154
;            ESP32-S3 · OV3660 2MP · 16 MB Flash · 8 MB OPI-PSRAM
;            IR-LEDs GPIO 47 (940 nm, 5× TX)
;
; Flashen:   pio run -t upload
; Monitor:   pio run -t monitor   (115200 Baud)
; ============================================================

; Gemeinsame Build-Flags (ohne Secrets) — von credentials.ini via ${base.build_flags} geerbt
[base]
build_flags =
    -DBOARD_HAS_PSRAM            ; aktiviert PSRAM in esp32-camera-Lib
    -DCORE_DEBUG_LEVEL=0         ; Serial-Debug-Ausgaben unterdrücken (Produktion)
    -DARDUINO_USB_CDC_ON_BOOT=1  ; USB-Serial via integriertem CDC (kein CH340 nötig)

; Secrets (WIFI_SSID, WIFI_PASS, MQTT_BROKER) kommen aus credentials.ini
; Vorlage: credentials.ini.example → kopieren und befüllen
extra_configs = credentials.ini

[env:dfr1154_cam]
platform  = espressif32
board     = esp32-s3-devkitc-1      ; kein eigener Board-Eintrag für DFR1154
framework = arduino

; --- Speicher-Konfiguration (kritisch für Kamera-Stabilität) ----
; Das Board hat 8 MB OPI-PSRAM; ohne psram_type = opi friert
; der Videostream bei hoher Auflösung ein.
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_build.partitions          = huge_app.csv  ; ~3 MB App-Partition für libcam

; --- Serielle Schnittstelle ------------------------------------
upload_port   = COM7
monitor_port  = COM7
monitor_speed = 115200

; --- Abhängigkeiten --------------------------------------------
; esp32-camera   : Espressif Kamera-HAL (OV3660 Support seit v2.0)
; PubSubClient   : MQTT Client (leichtgewichtig, kein Overhead)
; ArduinoJson    : Heartbeat-JSON serialisieren
lib_deps =
    https://github.com/espressif/esp32-camera.git   ; >= 2.0, OV3660 Support
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0
